steps:
  # Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/lexguard:$COMMIT_SHA",
        "-t",
        "gcr.io/$PROJECT_ID/lexguard:latest",
        "."
      ]

  # Push Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "gcr.io/$PROJECT_ID/lexguard:$COMMIT_SHA"
      ]

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "gcr.io/$PROJECT_ID/lexguard:latest"
      ]

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      [
        "run",
        "deploy",
        "lexguard",
        "--image",
        "gcr.io/$PROJECT_ID/lexguard:$COMMIT_SHA",
        "--region",
        "asia-south1",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--port",
        "3000",
        "--memory",
        "1Gi",
        "--cpu",
        "1",
        "--max-instances",
        "3",
        "--set-env-vars",
        "NODE_ENV=production"
      ]

images:
  - "gcr.io/$PROJECT_ID/lexguard:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/lexguard:latest"

options:
  logging: CLOUD_LOGGING_ONLY